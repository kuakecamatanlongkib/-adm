<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surat KUA Longkib</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- Layar lebar (>= 1024px): form di kiri, pratinjau langsung di kanan.
       Layar sempit (HP): form saja; tombol membuka surat di tab baru. -->
  <div class="layout">
    <main class="form-pane">
      <div class="app">
        <header class="appbar">
          <img class="appbar-logo" src="logo-kemenag.png" alt="" width="36" height="36"
               onerror="this.style.display='none'" />
          <div class="appbar-text">
            <h1 id="appTitle">Surat KUA Longkib</h1>
            <p>Kantor Urusan Agama Kecamatan Longkib</p>
          </div>
        </header>

        <form id="suratForm" class="card" novalidate>
          <h2 class="section-title">Jenis Surat</h2>
          <div class="tpl-picker" id="tplPicker"></div>

          <h2 class="section-title next">Data Surat</h2>
          <div id="fields"><!-- field dibangun otomatis dari template --></div>

          <div class="actions">
            <!-- Isi tombol diatur app.js: "Cetak / Simpan PDF" (layar lebar) atau "Pratinjau Surat" (HP) -->
            <button type="submit" id="btnSubmit" class="btn btn-primary">Pratinjau Surat</button>
            <button type="button" id="btnReset" class="btn btn-ghost">Kosongkan</button>
          </div>
        </form>

        <footer class="note" id="note"></footer>
      </div>
    </main>

    <section class="preview-pane" id="previewPane" aria-label="Pratinjau surat">
      <div class="preview-bar">
        <span class="preview-title">Pratinjau</span>
        <span class="preview-info" id="previewInfo">Lebih dari 1 halaman</span>
        <div class="seg" id="zoomSeg" role="group" aria-label="Ukuran pratinjau">
          <button type="button" data-zoom="lebar">Pas lebar</button>
          <button type="button" data-zoom="halaman">Satu halaman</button>
        </div>
      </div>
      <!-- Muncul bila surat otomatis memakai kertas F4 (isi tidak muat A4) -->
      <div class="preview-kertas" id="previewKertas" role="status">
        <span class="pill">Kertas F4 (Folio)</span>
        Isi surat tidak muat di A4, jadi kertas otomatis diganti ke F4 (215 × 330 mm). Siapkan kertas F4 saat mencetak.
      </div>
      <div class="preview-body" id="previewBody">
        <div class="preview-empty">
          <div class="preview-empty-sheet" aria-hidden="true"></div>
          <p>Pilih jenis surat untuk melihat pratinjau.</p>
        </div>
        <!-- iframe surat.html?embed=1 ditambahkan app.js -->
      </div>
    </section>
  </div>

  <script src="assets/util.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/templates.js"></script>
  <script src="assets/datepicker.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
