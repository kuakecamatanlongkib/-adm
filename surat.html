<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surat KUA Longkib</title>
<link rel="stylesheet" href="assets/surat.css" />
</head>
<body>
  <!-- Toolbar (mode mandiri saja; disembunyikan saat tampil di panel pratinjau) -->
  <!-- Satu baris: Kembali di kiri, Cetak di kanan. Info tampil sebagai strip di bawahnya. -->
  <div class="toolbar">
    <div class="tb-baris">
      <button type="button" class="tb-back" id="btnKembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Kembali</button>
      <button type="button" class="tb-print" id="btnCetak" aria-keyshortcuts="Control+P Meta+P"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>Cetak Surat</button>
    </div>
    <div class="tb-strip tb-lebih" id="tbInfo" role="status"><span class="pill">Lebih dari 1 halaman</span>Bagian di bawah garis merah tercetak di halaman 2.</div>
    <div class="tb-strip tb-f4" role="status"><span class="pill">Kertas F4</span>Isi surat tidak muat di A4, jadi kertas otomatis diganti ke F4 (215 × 330 mm). Siapkan kertas F4 saat mencetak.</div>
    <div class="tb-hint">Cubit layar untuk memperbesar. Untuk menyimpan PDF, pilih <strong>Save as PDF</strong> di dialog cetak.</div>
  </div>

  <!-- .sheet = wadah seukuran lembar setelah diperkecil; .page = lembar asli (A4, atau F4 bila otomatis diganti) -->
  <div class="sheet" id="sheet"><div class="page" id="page"><!-- surat dirender oleh surat.js --></div></div>

  <script src="assets/util.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/templates.js"></script>
  <script src="assets/surat.js"></script>
</body>
</html>
